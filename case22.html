
<!DOCTYPE html>
<html>
<head>
    <title>Movie Reviews</title>
    <style>
        body {
            background: #181818;
            color: white;
            font-family: Arial;
            text-align: center;
        }
        h1 { color: #ff4757; }
        .movies {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .card {
            background: #292929;
            padding: 15px;
            width: 200px;
            border-radius: 10px;
        }
        img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        p { color: #ffd166; }
    </style>
</head>
<body>

    <h1>🎬 Movie Reviews</h1>
    <h3>Discover Your Favorite Movies</h3>

    <div class="movies">
        <div class="card">
            <img src="https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg">
            <h3>Inception</h3>
            <p>⭐ 8.8/10</p>
            <p>Sci-Fi | 2010</p>
            <p>A dream within a dream.</p>
        </div>

        <div class="card">
            <img src="https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg">
            <h3>Interstellar</h3>
            <p>⭐ 8.7/10</p>
            <p>Sci-Fi | 2014</p>
            <p>A journey through space.</p>
        </div>

        <div class="card">
            <img src="https://image.tmdb.org/t/p/w500/ptpr0kGAckfQkJeJIt8st5dglvd.jpg">
            <h3>Oppenheimer</h3>
            <p>⭐ 8.3/10</p>
            <p>Drama | 2023</p>
            <p>A scientist's life story.</p>
        </div>
    </div>

</body>
</html>
